version: '3'

services:
  db:
    image: postgis/postgis:16-master
    restart: always
    container_name: habithamster-db
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=habithamster
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=change-me-dev-password
  
  redis:
    image: redis:7-alpine
    restart: always
    container_name: habithamster-redis
    ports:
      - "6379:6379"

  backend:
    restart: always
    container_name: habithamster-backend
    image: backend
    build:
      context: ./backend
    volumes:
      - "./backend:/backend"
      - ./backend/staticfiles:/backend/staticfiles
      - ./backend/media:/backend/media
    command: bash -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.environment
    depends_on:
      - db
  
  celery-worker:
    restart: always
    container_name: habithamster-celery-worker
    image: backend
    build:
      context: ./backend
    volumes:
      - "./backend:/backend"
    command: celery -A core worker -l info
    env_file:
      - ./backend/.environment
    depends_on:
      - db
      - redis
  
  celery-beat:
    restart: always
    container_name: habithamster-celery-beat
    image: backend
    build:
      context: ./backend
    volumes:
      - "./backend:/backend"
    command: celery -A core beat -l info
    env_file:
      - ./backend/.environment
    depends_on:
      - db
      - redis

networks:
  default:
    name: habithamster_network
